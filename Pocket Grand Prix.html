<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Pocket Grand Prix</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one column. Header, track picker, three-stat HUD strip, the track canvas, then results and controls.
   The column widens on big screens but is capped so the canvas still fits the window height.
   Single dark "track night" theme by choice; the canvas carries all the colour. */
:root{
  --ink:#12172b;
  --panel:#1b2342;
  --line:#33407a;
  --text:#eef1ff;
  --muted:#9fabd6;
  --accent:#ffd23f;
  --accent-ink:#2a1d00;
  --accent-edge:#b88a00;
  --me:#2a3563;
  --gas:#1f7a4d;
  --gas-edge:#35b377;
  --brake:#7a2230;
  --brake-edge:#c24055;
  --font-display:'Bungee','Impact','Arial Black',sans-serif;
  --font-body:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--ink);
  color:var(--text);
  font:500 16px/1.4 var(--font-body);
  padding-block:20px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:min(1120px,max(560px,calc((100vh - 290px) * 1.5)));margin:0 auto;display:grid;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 20px}
h1{margin:0;font:400 clamp(24px,5.5vw,38px)/1.05 var(--font-display);color:var(--accent);text-wrap:balance}
.tag{margin:0;color:var(--muted);font-size:15px;min-width:0}
.tracks{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(108px,1fr);gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:6px;margin-bottom:-6px;scrollbar-width:thin}
.trk{scroll-snap-align:start;display:flex;flex-direction:column;align-items:stretch;gap:2px;min-width:0;text-align:left;padding:5px 5px 7px;color:var(--text);background:var(--panel);border:2px solid var(--line);border-bottom-width:5px;border-radius:10px;font:inherit;cursor:pointer}
.trk b{font:400 clamp(10.5px,1.35vw,13px)/1.2 var(--font-display);padding:0 3px;overflow-wrap:anywhere}
.trk span{margin-top:auto;padding:0 3px;font-size:12.5px;line-height:1.25;color:var(--muted);font-variant-numeric:tabular-nums}
.thumb{display:block;width:100%;height:auto;aspect-ratio:176/112;border-radius:7px;margin-bottom:3px}
.trk[aria-checked="true"]{border-color:var(--accent);background:var(--me)}
.trk:focus-visible{outline:3px solid var(--text);outline-offset:3px}
.hud{position:absolute;left:12px;top:12px;display:flex;gap:6px;line-height:1.2;pointer-events:none}
.stat{background:rgba(18,23,43,.74);border-radius:10px;padding:5px 10px 6px;min-width:0}
.stat span{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.stat b{display:block;font:400 clamp(16px,3.4vw,26px)/1.1 var(--font-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.stage{position:relative;border:4px solid var(--line);border-radius:14px;overflow:hidden;background:#3f9d4b;line-height:0}
canvas{display:block;width:100%;height:auto;aspect-ratio:3/2;touch-action:none}
.results{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:14px 16px 12px}
.results h2{margin:0 0 8px;font:400 22px/1.1 var(--font-display);color:var(--accent)}
.results ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.results li{display:grid;grid-template-columns:24px 14px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 8px;border-radius:6px;font-size:18px;font-weight:600}
.results li.me{background:var(--me)}
.chip{width:14px;height:14px;border-radius:4px}
.tm{font-variant-numeric:tabular-nums;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.btn{font:400 18px/1 var(--font-display);background:var(--accent);color:var(--accent-ink);border:0;border-bottom:5px solid var(--accent-edge);border-radius:8px;padding:12px 22px 10px;cursor:pointer}
.btn:active{transform:translateY(3px);border-bottom-width:2px}
.btn.alt{background:var(--panel);color:var(--text);border:2px solid var(--line);border-bottom-width:5px;padding:10px 18px 8px}
.btn.alt[aria-pressed="false"]{color:var(--muted)}
.btn:focus-visible{outline:3px solid var(--text);outline-offset:3px}
.hint{display:none;margin:0;color:var(--muted);font-size:15px}
kbd{font:700 13px var(--font-body);background:var(--panel);border:1px solid var(--line);border-bottom-width:3px;border-radius:5px;padding:1px 6px;color:var(--text)}
body:not(.touch) .hint{display:block}
.play{display:grid;gap:12px}
.drive{display:none}
.touch .drive{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:14px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.wheel{width:100%;aspect-ratio:1;border-radius:50%;touch-action:none;cursor:grab;-webkit-tap-highlight-color:transparent}
.wheel svg{display:block;width:100%;height:100%;pointer-events:none}
.wheel .spoke{stroke:var(--me)}.wheel .rim{stroke:#0b0f20}.wheel .grip{stroke:var(--panel)}.wheel .mark{stroke:var(--accent)}.wheel .hub{fill:var(--panel);stroke:var(--accent)}.wheel .edge{stroke:var(--line)}
.steer{display:grid;gap:10px;justify-self:start;width:100%;max-width:206px;min-width:0}
.drift{display:flex;align-items:center;justify-content:center;width:100%;min-height:46px;padding:0 0 4px;color:#bff1ff;background:var(--me);border:2px solid #2f6f88;border-bottom-width:5px;border-radius:12px;
  font:400 15px/1 var(--font-display);letter-spacing:.1em;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;cursor:pointer}
.drift.on{transform:translateY(3px);border-bottom-width:2px;background:#2f6f88;color:#fff}
.drift:focus-visible{outline:3px solid var(--text);outline-offset:3px}
.pedals{display:flex;align-items:flex-end;gap:10px}
.pedal{display:flex;align-items:flex-end;justify-content:center;width:clamp(58px,17vw,78px);padding:0 0 11px;border:2px solid var(--pe);border-bottom-width:7px;border-radius:14px 14px 10px 10px;
  font:400 13px/1 var(--font-display);letter-spacing:.04em;color:var(--text);background:repeating-linear-gradient(180deg,rgba(0,0,0,.28) 0 5px,transparent 5px 15px),var(--pc);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;cursor:pointer}
.pedal.gas{--pc:var(--gas);--pe:var(--gas-edge);height:150px}
.pedal.brake{--pc:var(--brake);--pe:var(--brake-edge);height:112px}
.pedal.on{transform:translateY(4px) scaleY(.97);border-bottom-width:3px;filter:brightness(1.3)}
.pedal:focus-visible{outline:3px solid var(--text);outline-offset:3px}
.touch .play.done .drive{display:none}
@media (max-width:520px){.hud{left:8px;top:8px;gap:4px}.stat{padding:3px 7px 4px}.stat span{font-size:9px}.tracks{grid-auto-columns:minmax(118px,1fr)}.bar{gap:10px 8px}.btn{font-size:16px;padding:11px 15px 9px}.btn.alt{padding:9px 13px 7px}}
@media (orientation:landscape) and (max-height:560px){            /* phone on its side: wheel | track | pedals */
  .touch .wrap{max-width:none}
  .touch .play{grid-template-columns:auto minmax(0,1fr) auto;align-items:center}
  .touch .drive,.touch .play.done .drive{display:contents}
  .touch .steer{grid-column:1;grid-row:1;width:min(150px,22vw);max-width:none}
  .touch .stage{grid-column:2;grid-row:1;width:100%;max-width:calc((100vh - 44px) * 1.5);justify-self:center}
  .touch .pedals{grid-column:3;grid-row:1}
  .touch .pedal.gas{height:128px}.touch .pedal.brake{height:96px}
  .touch .play.done .steer,.touch .play.done .pedals{visibility:hidden}
}
</style>

<div class="wrap">
  <header>
    <h1>Pocket Grand Prix</h1>
    <p class="tag" id="tag">Four rivals, three laps. Hit the yellow pads for a boost.</p>
  </header>

  <div class="tracks" id="tracks" role="radiogroup" aria-label="Track"></div>

  <div class="play" id="play">
    <div class="stage">
      <canvas id="c" role="img" aria-label="View following your kart around the race track, with a small map in the corner"></canvas>
      <div class="hud" id="hud" aria-label="Race status" hidden>
        <div class="stat"><span>Position</span><b id="hPos">4th</b></div>
        <div class="stat"><span>Lap</span><b id="hLap">1/3</b></div>
        <div class="stat"><span>Time</span><b id="hTime">0:00.0</b></div>
      </div>
    </div>
    <div class="drive" id="drive" aria-label="Touch controls">
      <div class="steer">
      <div class="wheel" id="wheel" aria-label="Steering wheel: drag to turn">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <path class="spoke" d="M24 100H176M100 100V176" fill="none" stroke-width="15" stroke-linecap="round"/>
          <circle class="rim" cx="100" cy="100" r="88" fill="none" stroke-width="20"/>
          <circle class="grip" cx="100" cy="100" r="88" fill="none" stroke-width="16" stroke-dasharray="3 7" opacity=".55"/>
          <circle class="edge" cx="100" cy="100" r="78" fill="none" stroke-width="2"/>
          <path class="mark" d="M100 3V22" fill="none" stroke-width="9"/>
          <circle class="hub" cx="100" cy="100" r="27" stroke-width="4"/>
          <path class="mark" d="M100 86l11 17H89z" fill="var(--accent)" stroke="none"/>
        </svg>
      </div>
        <button class="drift" id="drift" type="button" data-k="drift" aria-label="Drift: hold while you steer, let go for a boost">Drift</button>
      </div>
      <div class="pedals">
        <button class="pedal brake" type="button" data-k="down" aria-label="Brake pedal">Brake</button>
        <button class="pedal gas" type="button" data-k="up" aria-label="Accelerator pedal">Gas</button>
      </div>
    </div>
  </div>

  <section class="results" id="results" hidden aria-live="polite">
    <h2 id="rTitle">Race results</h2>
    <ol id="rList"></ol>
  </section>

  <div class="bar">
    <button class="btn" id="go" type="button">Start race</button>
    <button class="btn alt" id="mus" type="button" aria-pressed="true">Music on</button>
    <button class="btn alt" id="camBtn" type="button">Chase cam</button>
    <p class="hint" id="hint"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> steer &nbsp; <kbd>&uarr;</kbd> gas &nbsp; <kbd>&darr;</kbd> brake &nbsp; <kbd>Space</kbd> drift &nbsp; or W A S D. Enter starts, R restarts, <kbd>M</kbd> music, <kbd>C</kbd> camera, <kbd>1</kbd> to <kbd>7</kbd> pick a track.</p>
  </div>

</div>

<script>
/* ===================== Pocket Grand Prix ===================== */
const W = 960, H = 640;                 // viewport (the canvas)
const LAPS = 3;
const TRACK_W = 140, HALF = TRACK_W / 2, WALL = HALF + 44;   // asphalt width, half width, hedge distance
const MAXV = 230, BOOSTMUL = 1.4, ACC = 300, BRAKE = 440, DRAG = 110, REV = 70, TURN = 2.6;
const TRACK_SCALE = 1.2;                // every circuit's layout is stretched by this much (the road and karts keep their size)
const AI_EASE = 0.95;                   // rivals drive at this fraction of their full pace (1 = flat out)
const KS = 1.25, KR = 28;               // kart drawing scale, collision spacing

/* ---------- the seven tracks ----------
   cp: centre-line control points, or poly: a rounded polygon [[x, y, corner radius], ...], driven in this order.
   world: [width, height] of the map.
   start: a point on a long straight. pads: boost pad positions (snapped to the road). ai: rival speed factor. */
const TRACKS = [
  { id: 'meadow', name: 'Meadow Circuit', level: 'Easy', world: [2300, 1500], start: [1250, 250], ai: 1,
    pal: { gA: '#3f9d4b', gB: '#3a9546', hedge: '#1f6b34', rough: '#7bd35f', kerb: '#e8434f', asphalt: '#3a4156', bushD: '#2f7f3e', bushL: '#4cae56', dots: ['#ffffff', '#ffe27a', '#ff9ec4'] },
    pads: [[1380, 250], [2040, 760], [285, 800], [1640, 1180]],
    // Long straights, wide sweeping corners and one gentle S on the bottom.
    cp: [[560,310],[1000,250],[1500,250],[1900,340],[2070,620],[2010,920],[1790,1130],[1500,1240],[1230,1120],[960,1120],[730,1250],[450,1180],[290,930],[280,640],[380,420]] },
  { id: 'dune', name: 'Dune Run', level: 'Easy', world: [2600, 1600], start: [1300, 290], ai: 1,
    pal: { gA: '#e6bd72', gB: '#dfb366', hedge: '#9a5a34', rough: '#f4dca6', kerb: '#d9482b', asphalt: '#4b4a52', bushD: '#6b8a3e', bushL: '#93ae5a', dots: ['#fff1c9', '#c9763a', '#f6c46a'] },
    pads: [[1800, 290], [2310, 730], [1810, 1076], [366, 705]],
    // Fast and flowing: huge radii and one gentle dent on the way back.
    poly: [[420,300,240],[2250,290,420],[2380,1250,320],[1560,1000,300],[1020,1330,320],[300,1180,300]] },
  { id: 'lagoon', name: 'Lagoon Loop', level: 'Medium', world: [2500, 1700], start: [1150, 260], ai: 1.015,
    pal: { gA: '#2aa7d8', gB: '#2599c8', hedge: '#c9a35b', rough: '#f0dca3', kerb: '#2f7de1', asphalt: '#4a505f', bushD: '#1f9d6a', bushL: '#43c993', dots: ['#ffffff', '#bfe9ff', '#e8fbff'] },
    pads: [[1300, 262], [2230, 730], [1090, 1290], [275, 880]],
    // A long top straight, a big right-hand sweep, then a quick left-right chicane before the bottom run.
    cp: [[500,300],[900,260],[1400,260],[1800,300],[2150,450],[2250,800],[2100,1100],[1750,1200],[1500,990],[1230,1180],[950,1400],[600,1450],[330,1250],[260,900],[330,600]] },
  { id: 'frost', name: 'Frost Hollow', level: 'Medium', world: [2500, 1750], start: [1650, 280], ai: 1.02,
    pal: { gA: '#eaf3fc', gB: '#e0ecf8', hedge: '#6f88aa', rough: '#bcd6ec', kerb: '#e5484d', asphalt: '#3d4558', bushD: '#2d6a54', bushL: '#4f9677', dots: ['#ffffff', '#b7d3ee', '#8fb8e0'] },
    pads: [[1850, 280], [2150, 850], [1700, 1450], [380, 610]],
    // L-shaped: a dip chicane on the top straight, a long right-hand side, then one left turn round the inside corner.
    poly: [[380,280,220],[900,280,160],[1120,500,170],[1340,280,160],[2150,280,230],[2150,1450,230],[1250,1450,230],[1250,950,200],[380,950,230]] },
  { id: 'mossback', name: 'Mossback Trail', level: 'Hard', world: [2650, 1750], start: [1150, 310], ai: 1.025,
    pal: { gA: '#1f6d3b', gB: '#1b6436', hedge: '#0f3d22', rough: '#8d6a3d', kerb: '#f2b01e', asphalt: '#5b4a3b', bushD: '#14522d', bushL: '#2f8a4d', dots: ['#ff6b6b', '#ffd23f', '#ff9ec4'] },
    pads: [[1300, 300], [2360, 780], [1525, 1250], [275, 950]],
    // Diagonal jungle trail: a kinked top, a zig-zag slalom along the bottom and a fast climb up the left side.
    poly: [[560,330,200],[1450,290,180],[1950,560,200],[2350,430,170],[2370,1050,230],[1800,1400,230],[1250,1100,180],[800,1450,190],[300,1250,220],[260,700,230]] },
  { id: 'cinder', name: 'Cinder Pass', level: 'Hard', world: [2400, 1700], start: [1200, 250], ai: 1.03,
    pal: { gA: '#2e2c38', gB: '#292731', hedge: '#16151c', rough: '#8a5a3c', kerb: '#ff7a1a', asphalt: '#4a4f66', bushD: '#1f1e27', bushL: '#4a485c', dots: ['#ff8a3d', '#ffd23f', '#ff5a36'] },
    pads: [[1380, 250], [2190, 750], [1650, 1390], [1000, 1130]],
    // Fast top straight, then a deep hairpin inlet on the bottom and a set of esses up the left side.
    cp: [[560,300],[950,250],[1450,250],[1850,320],[2150,550],[2200,900],[2050,1200],[1800,1380],[1550,1400],[1330,1300],[1300,1000],[1300,850],[1256,744],[1150,700],[1044,744],[1000,850],[1000,1000],[1000,1250],[920,1400],[700,1450],[450,1400],[300,1230],[240,1000],[350,800],[250,600],[360,400]] },
  { id: 'harbor', name: 'Midnight Harbor', level: 'Expert', world: [2550, 1650], start: [1700, 300], ai: 1.045,
    pal: { gA: '#1b2442', gB: '#18203b', hedge: '#0a0e1c', rough: '#4b5880', kerb: '#e0338a', asphalt: '#252938', bushD: '#2c3a69', bushL: '#4660b0', dots: ['#ffd23f', '#7fe7ff', '#ff7ab6'] },
    pads: [[1950, 300], [2250, 850], [900, 1350], [300, 830]],
    // Tight and technical: a square dip off the top straight and a matching notch on the bottom run.
    poly: [[300,300,200],[700,300,170],[700,720,170],[1150,720,170],[1150,300,170],[2250,300,200],[2250,1350,200],[1850,1350,170],[1850,1000,170],[1400,1000,170],[1400,1350,170],[300,1350,200]] }
];

const ROSTER = [
  { name: 'Bluebell',  color: '#3b82f6', cap: 1, nerve: 0.96, lane: 0 },
  { name: 'Lime',      color: '#84cc16', cap: 1, nerve: 1, lane: -4 },
  { name: 'Plum',      color: '#a855f7', cap: 1, nerve: 0.97, lane: 9 },
  { name: 'You',       color: '#ff4d5e', player: true },
  { name: 'Tangerine', color: '#fb923c', cap: 0.97, nerve: 0.94, lane: -9 }
];
const GRID = [{ back: 4, side: -1 }, { back: 8, side: 1 }, { back: 12, side: -1 }, { back: 16, side: 1 }, { back: 20, side: -1 }];

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const wrap = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
const ord = n => ['', '1st', '2nd', '3rd', '4th'][n] || n + 'th';
const fmt = t => { const ts = Math.round(t * 10), m = Math.floor(ts / 600), s = (ts % 600) / 10; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1); };
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// Per-track values, filled in by loadTrack().
let WW = 2300, WH = 1500, N = 500, CP = [], C = TRACKS[0].pal, AIM = 1, curTrack = 0;
let P = [], START = 0, PADS = [], LINE = [], PF = [], SP = 10;

const cv = $('c'), ctx = cv.getContext('2d');
const S = Math.min(2, Math.max(1.25, window.devicePixelRatio || 1));   // canvas backing scale
const BS = Math.min(S, 1.25);                                          // world picture scale
cv.width = Math.round(W * S); cv.height = Math.round(H * S);
const bg = document.createElement('canvas');
const MW = 200; let MH = 130;
const mini = document.createElement('canvas');

/* ---------- track geometry ---------- */
// Rounded-polygon helper: [[x, y, corner radius], ...] becomes evenly spaced centre-line points.
// A corner's radius shrinks by itself when two corners sit too close together.
function fillet(V) {
  const n = V.length, out = [];
  const arcs = V.map((c, i) => {
    const a = V[(i + n - 1) % n], b = V[(i + 1) % n];
    let ux = a[0] - c[0], uy = a[1] - c[1], vx = b[0] - c[0], vy = b[1] - c[1];
    const lu = Math.hypot(ux, uy), lv = Math.hypot(vx, vy);
    ux /= lu; uy /= lu; vx /= lv; vy /= lv;
    const th = Math.acos(clamp(ux * vx + uy * vy, -1, 1)), tn = Math.tan(th / 2);
    const t = Math.min(c[2] / tn, lu * 0.48, lv * 0.48), r = t * tn;
    const s = [c[0] + ux * t, c[1] + uy * t], e = [c[0] + vx * t, c[1] + vy * t];
    const bx = ux + vx, by = uy + vy, bl = Math.hypot(bx, by), d = r / Math.sin(th / 2);
    const cx = c[0] + bx / bl * d, cy = c[1] + by / bl * d;
    const a0 = Math.atan2(s[1] - cy, s[0] - cx), da = wrap(Math.atan2(e[1] - cy, e[0] - cx) - a0);
    const k = Math.max(2, Math.ceil(Math.abs(da) * r / 55)), mid = [];
    for (let j = 1; j < k; j++) { const q = a0 + da * j / k; mid.push([cx + Math.cos(q) * r, cy + Math.sin(q) * r]); }
    return { s, e, mid };
  });
  for (let i = 0; i < n; i++) {

function collide() {
  for (let i = 0; i < karts.length; i++) for (let j = i + 1; j < karts.length; j++) {
    const a = karts[i], b = karts[j]; let dx = b.x - a.x, dy = b.y - a.y; const d = Math.hypot(dx, dy);
    if (d < KR && d > 0.001) { dx /= d; dy /= d; const o = (KR - d) / 2; a.x -= dx * o; a.y -= dy * o; b.x += dx * o; b.y += dy * o; a.v *= 0.985; b.v *= 0.985; }

}
function onPlayerFinish() {

    bests[curTrack] = player.finishTime; newBest = true;
    try { localStorage.setItem('pocket-grand-prix-best-' + TRACKS[curTrack].id, String(player.finishTime)); } catch (e) {}

}
function update(dt) {

  } else if (state === 'racing' || state === 'finished') {
    raceTime += dt; if (goT > 0) goT -= dt; if (finT > 0) finT -= dt;
    for (const k of karts) {

      stepKart(k, k.ai ? aiControl(k, dt) : playerInput(), dt);

}

/* ---------- drawing ---------- */
function bigText(txt, x, y, size, fill, weight, family) {

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.lineWidth = size * 0.16; ctx.strokeStyle = '#12172b'; ctx.strokeText(txt, x, y);
  ctx.fillStyle = fill; ctx.fillText(txt, x, y);
}
function drawPads() {
  for (const pd of PADS) {
    ctx.save(); ctx.translate(pd.x, pd.y); ctx.rotate(pd.a);
    ctx.fillStyle = '#ffd23f'; rr(ctx, -22, -44, 44, 88, 8); ctx.fill();
    ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    [-11, 1, 13].forEach((o, i) => {
      ctx.strokeStyle = `rgba(122,76,0,${0.55 + 0.45 * Math.sin(tAnim * 9 - i * 1.3)})`;
      ctx.beginPath(); ctx.moveTo(o - 5, -18); ctx.lineTo(o + 5, 0); ctx.lineTo(o - 5, 18); ctx.stroke();
    });
    ctx.restore();
  }
}
function drawKart(k) {
  ctx.save(); ctx.translate(k.x, k.y); ctx.rotate(k.a); ctx.scale(KS, KS);
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(2, 4, 18, 11, 0, 0, 7); ctx.fill();
  if (k.boost > 0) {
    const f = 12 + Math.random() * 9;
    ctx.fillStyle = '#ff8a1f'; ctx.beginPath(); ctx.moveTo(-16, -5); ctx.lineTo(-16 - f, 0); ctx.lineTo(-16, 5); ctx.fill();
    ctx.fillStyle = '#ffe27a'; ctx.beginPath(); ctx.moveTo(-16, -2.5); ctx.lineTo(-16 - f * .55, 0); ctx.lineTo(-16, 2.5); ctx.fill();
  }
  ctx.fillStyle = '#161922';
  for (const [wx, wy] of [[-9, -10], [-9, 10], [9, -10], [9, 10]]) { rr(ctx, wx - 5, wy - 2.5, 10, 5, 2); ctx.fill(); }
  ctx.fillStyle = '#161922'; rr(ctx, -18, -8, 4, 16, 1.5); ctx.fill();                 // rear wing
  ctx.fillStyle = k.color; rr(ctx, -15, -8, 30, 16, 6); ctx.fill();                    // body
  ctx.lineWidth = k.isPlayer ? 2 : 1.2; ctx.strokeStyle = k.isPlayer ? '#ffffff' : 'rgba(0,0,0,.4)'; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.28)'; rr(ctx, 4, -5.5, 11, 11, 4); ctx.fill();     // bonnet
  ctx.fillStyle = '#f6f1e7'; ctx.beginPath(); ctx.arc(-3, 0, 5.2, 0, 7); ctx.fill();    // helmet
  ctx.fillStyle = '#1b2342'; rr(ctx, -1.2, -3.4, 4, 6.8, 2); ctx.fill();               // visor
  ctx.restore();

}
function drawMinimap() {
  const x0 = W - MW - 16, y0 = H - MH - 16, ms = MW / WW;
  ctx.fillStyle = 'rgba(18,23,43,.72)'; rr(ctx, x0 - 6, y0 - 6, MW + 12, MH + 12, 10); ctx.fill();
  ctx.drawImage(mini, x0, y0, MW, MH);

    ctx.fillStyle = k.color; ctx.beginPath(); ctx.arc(x0 + k.x * ms, y0 + k.y * ms, k.isPlayer ? 6 : 4.5, 0, 7); ctx.fill();

}
function drawSpeed() {                    // speedometer, bottom-left; it becomes a drift meter while you slide
  if (!player || state === 'menu') return;
  const u = cv.clientWidth > 0 && cv.clientWidth < 640 ? 1.4 : 1;
  const x0 = 0, y0 = -52, w = 208, h = 52, boosting = player.boost > 0, drifting = player.drT > 0;
  const tier = player.drT >= 1.4 ? 2 : player.drT >= 0.7 ? 1 : 0;
  const hot = boosting ? '#ff9f1c' : tier ? (tier === 2 ? '#ff9ec4' : '#7fe7ff') : '#ffd23f';
  const lit = Math.round(clamp(drifting ? player.drT / 1.4 : Math.abs(player.v) / 520, 0, 1) * 12);
  ctx.save(); ctx.translate(16, H - 16); ctx.scale(u, u);
  ctx.fillStyle = 'rgba(18,23,43,.72)'; rr(ctx, x0, y0, w, h, 10); ctx.fill();
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = '400 26px Bungee, Impact, "Arial Black", sans-serif'; ctx.fillStyle = boosting ? '#ff9f1c' : '#eef1ff';
  ctx.fillText(String(Math.round(Math.abs(player.v) * 0.4)), x0 + 12, y0 + 22);
  ctx.font = '700 11px "Barlow Semi Condensed", Arial, sans-serif'; ctx.fillStyle = boosting || drifting ? hot : '#9fabd6';
  ctx.fillText(boosting ? 'BOOST' : drifting ? 'DRIFT' : 'KM/H', x0 + 12, y0 + 42);
  for (let i = 0; i < 12; i++) { ctx.fillStyle = i < lit ? hot : 'rgba(255,255,255,.16)'; rr(ctx, x0 + 92 + i * 9, y0 + 14, 6, 24, 2); ctx.fill(); }

}
function render() {
  ctx.setTransform(S, 0, 0, S, 0, 0); ctx.globalAlpha = 1;

    ctx.save();
    ctx.translate(W / 2, H * anchorY); ctx.rotate(viewRot); ctx.scale(ZOOM, ZOOM); ctx.translate(-cam.x, -cam.y);
    const R = Math.hypot(W / 2, H * Math.max(anchorY, 1 - anchorY)) / ZOOM + 6;      // how far from the kart anything can reach the screen
    for (let x = Math.floor((cam.x - R) / 80) * 80; x < cam.x + R; x += 80) { ctx.fillStyle = (x / 80) & 1 ? C.gA : C.gB; ctx.fillRect(x, cam.y - R, 80, 2 * R); }   // grass past the edge of the map

    if (ex > sx && ey > sy) ctx.drawImage(bg, sx * BS, sy * BS, (ex - sx) * BS, (ey - sy) * BS, sx, sy, ex - sx, ey - sy);

    ctx.save(); ctx.translate(W / 2, 14); ctx.scale(u, u);
    ctx.fillStyle = 'rgba(18,23,43,.84)'; rr(ctx, -300, 0, 600, 176, 18); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = '#33407a'; ctx.stroke();
    bigText(T.name.toUpperCase() + '  \u00b7  ' + T.level.toUpperCase(), 0, 34, 24, '#9fabd6');
    bigText('READY TO RACE?', 0, 92, 56, '#ffd23f');
    bigText((document.body.classList.contains('touch') ? 'Tap the track to start' : 'Press Enter or tap to start') + (best !== null ? '  \u00b7  Best ' + fmt(best) : ''), 0, 146, 25, '#eef1ff', 700, '"Barlow Semi Condensed"');
    ctx.restore();
  } else if (state === 'countdown') {
    const n = Math.max(1, Math.ceil(cdT)), f = cdT - Math.floor(cdT);
    ctx.save(); ctx.translate(W / 2, 280); ctx.scale(0.8 + 0.4 * f, 0.8 + 0.4 * f);
    bigText(String(n), 0, 0, 170, ['#ffd23f', '#ff9f1c', '#ff4d5e'][n - 1] || '#ff4d5e');
    ctx.restore();

    ctx.globalAlpha = clamp(goT * 1.6, 0, 1); bigText('GO!', W / 2, 280, 150, '#5cf08a'); ctx.globalAlpha = 1;
  } else if (state === 'finished' && finT > 0) {

    bigText('FINISH!', W / 2, 230, 110, '#ffd23f');
    bigText(ord(player.place), W / 2, 330, 90, player.place === 1 ? '#5cf08a' : '#eef1ff');
    if (newBest) bigText('New best time', W / 2, 405, 34, '#ffd23f', 700, '"Barlow Semi Condensed"');

/* ---------- page UI ---------- */

/* ---------- music ----------
   An original chiptune loop built with the Web Audio API (no audio files): drums, bass, an arpeggio and a lead
   over four chords, eight bars long. It starts with the race and fades out at the finish. */
const Music = (() => {
  const BPM = 150, STEP = 60 / BPM / 4, LEVEL = 0.4;                 // STEP is one sixteenth note
  const ROOT = [45, 41, 48, 43];                                     // bass root per bar: A, F, C, G
  const TRIAD = [[57, 60, 64], [53, 57, 60], [60, 64, 67], [55, 59, 62]];
  const BASS = [0, 0, 12, 0, 0, 12, 7, 0];                           // semitones above the root, one per eighth note
  const LEAD = [                                                     // [step in bar, MIDI note, length in steps]
    [[0,76,3],[3,76,1],[4,72,2],[6,69,2],[8,72,3],[11,74,1],[12,76,4]],
    [[0,77,3],[3,77,1],[4,74,2],[6,72,2],[8,69,3],[11,72,1],[12,74,4]],
    [[0,79,3],[3,79,1],[4,76,2],[6,72,2],[8,67,3],[11,72,1],[12,76,4]],
    [[0,74,3],[3,74,1],[4,71,2],[6,67,2],[8,71,3],[11,74,1],[12,79,4]],
    [[0,81,2],[2,79,2],[4,76,2],[6,72,2],[8,76,4],[12,72,2],[14,69,2]],
    [[0,77,2],[2,76,2],[4,72,2],[6,69,2],[8,72,4],[12,77,2],[14,76,2]],
    [[0,79,2],[2,76,2],[4,72,2],[6,76,2],[8,79,4],[12,77,2],[14,76,2]],
    [[0,74,2],[2,71,2],[4,67,2],[6,71,2],[8,74,2],[10,77,2],[12,79,4]]
  ];
  let ac = null, master = null, noise = null, timer = null, step = 0, next = 0, enabled = true, running = false;
  try { enabled = localStorage.getItem('pocket-grand-prix-music') !== '0'; } catch (e) {}
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  function setup() {                                                 // created on the first race start, which is a tap or key press
    if (ac) return true;
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      const comp = ac.createDynamicsCompressor();
      master = ac.createGain(); master.gain.value = LEVEL;
      master.connect(comp); comp.connect(ac.destination);

      const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      return true;
    } catch (e) { ac = null; return false; }
  }

    env(g, t, dur, vol); o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.03);
  }

    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noise; f.type = 'highpass'; f.frequency.value = hp; env(g, t, dur, vol);
    s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random() * 0.5, dur + 0.03);
  }
  function kick(t) {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine';
    o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    env(g, t, 0.18, 0.9); o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.22);
  }

    if (st % 4 === 0) kick(t);
    if (st === 4 || st === 12) { hit(t, 0.14, 0.35, 1400); tone('triangle', 190, t, 0.08, 0.25); }
    if (st % 2 === 0) { hit(t, 0.04, st % 4 === 2 ? 0.16 : 0.09, 7000); tone('triangle', hz(ROOT[c] + BASS[st / 2]), t, STEP * 1.8, 0.32); }

    for (const n of LEAD[bar]) if (n[0] === st) tone('square', hz(n[1]), t, n[2] * STEP * 0.95, 0.08);

    if (!ac) return;

    },
    toggle() {

    },
    hidden(h) { if (!ac) return; if (h) ac.suspend(); else if (running) ac.resume(); }
  };
})();
function syncMusic() { const b = $('mus'); b.textContent = Music.enabled ? 'Music on' : 'Music off'; b.setAttribute('aria-pressed', String(Music.enabled)); }
function toggleMusic() {
  const on = Music.toggle();

/* ---------- input ---------- */
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', Space: 'drift', ShiftLeft: 'drift', ShiftRight: 'drift' };
addEventListener('keydown', e => {
  const k = KEYMAP[e.code];
  if (k) { keys[k] = true; e.preventDefault(); return; }
  const num = /^(Digit|Numpad)([1-9])$/.exec(e.code);
  if (num && +num[2] <= TRACKS.length) { if (state === 'menu' || state === 'finished') selectTrack(+num[2] - 1); return; }
  if (e.code === 'Enter' && (state === 'menu' || state === 'finished')) { e.preventDefault(); startRace(); }
  else if (e.code === 'KeyR') startRace();
  else if (e.code === 'KeyM') toggleMusic();
  else if (e.code === 'KeyC') toggleCam();
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) { keys[k] = false; e.preventDefault(); } });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; wheel.pid = null; });
$('go').addEventListener('click', () => { startRace(); $('go').blur(); });
$('tracks').addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('.trk');
  if (b) { selectTrack(+b.dataset.t); const nb = $('tracks').querySelector('.trk[aria-checked="true"]'); if (nb) nb.focus(); }
});
cv.addEventListener('pointerdown', () => { if (state === 'menu' || state === 'finished') startRace(); });
$('camBtn').addEventListener('click', () => { toggleCam(); $('camBtn').blur(); });

/* ---------- touch driving: steering wheel and two pedals ----------
   The wheel turns as far as your thumb drags it round and springs back to centre when you let go; how far it is
   turned is the steering. The pedals are independent, so wheel, gas and brake can all be down at once. */
const touchMQ = matchMedia('(hover:none),(pointer:coarse)');
const syncTouch = () => document.body.classList.toggle('touch', touchMQ.matches);
syncTouch();
if (touchMQ.addEventListener) touchMQ.addEventListener('change', syncTouch); else if (touchMQ.addListener) touchMQ.addListener(syncTouch);

const wheel = { ang: 0, pid: null, last: 0, deg: 0 };
const WHEEL_LOCK = 1.57, WHEEL_FULL = 1.1;             // the wheel stops at 90 degrees; full steering is reached at about 63
const wheelEl = $('wheel'), wheelSvg = wheelEl.querySelector('svg');
function wheelSteer() { const s = clamp(wheel.ang / WHEEL_FULL, -1, 1); return Math.abs(s) < 0.04 ? 0 : s; }
function wheelAngle(e) {                               // the thumb's angle round the hub, or null if it is too close to the hub to tell
  const r = wheelEl.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  return Math.hypot(dx, dy) < r.width * 0.1 ? null : Math.atan2(dy, dx);
}
wheelEl.addEventListener('pointerdown', e => {
  if (wheel.pid !== null) return;
  e.preventDefault(); wheel.pid = e.pointerId; wheel.last = wheelAngle(e);
  try { wheelEl.setPointerCapture(e.pointerId); } catch (err) {}
});
wheelEl.addEventListener('pointermove', e => {
